server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
    location = /runtime-config.json { add_header Cache-Control "no-store"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
