name: 检查与容器验证
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:runtime
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: 验证镜像与运行配置
        run: |
          docker build --build-arg BUILD_REVISION="$GITHUB_SHA" -t ops-demo-frontend .
          docker run -d --name frontend -p 8080:80 -e DEMO_EXPECTED_WEIGHT1=80 -e DEMO_EXPECTED_WEIGHT2=20 ops-demo-frontend
          for attempt in $(seq 1 30); do curl --fail http://localhost:8080/health && break; sleep 1; done
          curl --fail http://localhost:8080/runtime-config.json | jq -e --arg revision "$GITHUB_SHA" '.weight1 == 80 and .weight2 == 20 and .buildRevision == $revision'
          curl --fail http://localhost:8080/ | grep -q 'OPS'
      - if: always()
        run: docker rm -f frontend || true
