name: Community checks
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    name: community-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash .github/quiet-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pull request commit identities
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_maintainer.py
      - name: 检查拉取请求分支和标题
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_subjects.py --pull-request
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: 运行与本地提交相同的工程检查
        run: python3 scripts/check.py
